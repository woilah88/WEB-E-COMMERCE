<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - XemaShop</title>
  <link rel="stylesheet" href="checkout.css?v=2">
</head>
<body>

  <!-- HEADER SIMPLE -->
  <header class="checkout-header">
    <h1 class="logo">XemaShop</h1>
  </header>

  <main class="container">
    
    <!-- TOMBOL KEMBALI DI PINGGIR KIRI -->
    <div style="text-align: left;">
      <a href="../halaman utama/halaman utama.html" class="back-btn">← Kembali ke Beranda</a>
    </div>

    <!-- JUDUL HALAMAN -->
    <h1 class="page-title">Tujuan pengiriman</h1>

    <div class="checkout-container">
      
      <!-- FORM INPUT DATA PEMBELI -->
      <div class="form-section">
        <form id="checkout-form">
          <div class="form-group">
            <label for="nama">Nama Penerima</label>
            <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
          </div>

          <div class="form-group">
            <label for="phone">Nomor WhatsApp</label>
            <input type="tel" id="phone" placeholder="Contoh: 08123456789" required>
          </div>

          <div class="form-group">
            <label for="alamat">Alamat Pengiriman</label>
            <textarea id="alamat" rows="3" placeholder="Jl. Raya No. 123, Kota, Provinsi" required></textarea>
          </div>

          <!-- INPUT JASA PENGIRIMAN (ONGKIR) -->
          <div class="form-group">
            <label for="courier">Jasa Pengiriman (Ongkir)</label>
            <select id="courier" required>
              <option value="J&T Express|10000">J&T Express (Reguler) - Rp 10.000</option>
              <option value="JNE Reguler|12000">JNE Reguler - Rp 12.000</option>
              <option value="SiCepat Halu|8000">SiCepat Halu (Hemat) - Rp 8.000</option>
              <option value="GoSend Instant|25000">GoSend Instant - Rp 25.000</option>
            </select>
          </div>

          <div class="form-group">
            <label for="payment">Metode Pembayaran</label>
            <select id="payment" required>
              <option value="Transfer Bank (BCA)">Transfer Bank (BCA)</option>
              <option value="Transfer Bank (Mandiri)">Transfer Bank (Mandiri)</option>
              <option value="E-Wallet (Gopay/OVO/Dana)">E-Wallet (Gopay/OVO/Dana)</option>
              <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
            </select>
          </div>

          <button type="submit" class="checkout-btn">Konfirmasi & Bayar Sekarang</button>
        </form>
      </div>

      <!-- RINGKASAN PESANAN -->
      <div class="summary-section">
        <h2>Ringkasan Pesanan</h2>
        <div id="checkout-items-list">
          <!-- Disuntikkan JS -->
        </div>

        <!-- INPUT KODE VOUCHER -->
        <div style="margin-top: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #1e293b; margin-bottom: 0.35rem;">Kode Promo / Voucher</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="voucher-input" placeholder="Masukkan kode" style="flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.85rem; outline: none; background: #f8fafc;">
            <button type="button" id="apply-voucher-btn" style="padding: 0.5rem 0.9rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">Gunakan</button>
          </div>
          <p id="voucher-message" style="font-size: 0.8rem; margin-top: 0.3rem; display: none;"></p>
        </div>
        
        <hr class="summary-divider">

        <!-- RINCIAN HARGA TRANSPARAN -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.9rem; color: #64748b;">
          <span>Subtotal Produk:</span>
          <span id="checkout-subtotal">Rp 0</span>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.9rem; color: #64748b;">
          <span id="courier-label-display">Ongkir Pengiriman:</span>
          <span id="checkout-ongkir">Rp 0</span>
        </div>

        <!-- BARIS DISKON VOUCHER -->
        <div id="discount-row" style="display: none; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.9rem; color: #10b981; font-weight: 600;">
          <span>Diskon Voucher:</span>
          <span id="checkout-discount">-Rp 0</span>
        </div>

        <hr class="summary-divider" style="margin-top: 0;">

        <div class="summary-total">
          <span>Total Pembayaran:</span>
          <span id="checkout-total-price" class="total-amount">Rp 0</span>
        </div>
      </div>

    </div>
  </main>

  <!-- MODAL RECEIPT / NOTA -->
  <div class="modal-overlay" id="receipt-modal">
    <div class="receipt-card">
      <h2>Transaksi Berhasil!</h2>
      <p style="color: #64748b; font-size: 0.88rem; margin-bottom: 1rem;">Terima kasih telah berbelanja di <strong>XemaShop</strong>.</p>
      
      <div id="receipt-details" style="text-align: left; background: #f8fafc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem;">
        <!-- Detail Nota Disuntikkan via JS -->
      </div>
      
      <a id="wa-btn" href="#" target="_blank" class="checkout-btn" style="display: block; text-decoration: none; background-color: #25d366; margin-bottom: 0.6rem; text-align: center;">
        Konfirmasi via WhatsApp
      </a>

      <button class="checkout-btn" style="background-color: #64748b; width: 100%;" onclick="finishOrder()">Kembali ke Halaman Utama</button>
    </div>
  </div>

  <script src="checkout.js"></script>
</body>
</html>
