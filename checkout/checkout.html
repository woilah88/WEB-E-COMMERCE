<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - XemaShop</title>
    <link rel="stylesheet" href="../halaman utama/halaman-utama.css?v=9999">
    <link rel="stylesheet" href="checkout.css?v=5555">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2>XemaShop</h2>
        </div>
        <a href="../halaman utama/halaman utama.html" style="text-decoration: none; color: var(--primary-color); font-weight: 600; font-size: 0.9rem;">
            ← Kembali ke Beranda
        </a>
    </header>

    <main class="container" style="max-width: 1000px; margin: 2rem auto;">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--text-dark);">Tujuan Pengiriman</h2>

        <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 1.5rem; align-items: start;">
            
            <!-- FORM PENGIRIMAN -->
            <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow);">
                <form id="checkout-form">
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Nama Penerima</label>
                        <input type="text" id="input-name" placeholder="Masukkan nama lengkap" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 8px;">
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Nomor WhatsApp</label>
                        <input type="tel" id="input-phone" placeholder="Contoh: 085731413109" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 8px;">
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Alamat Pengiriman</label>
                        <textarea id="input-address" rows="3" placeholder="Jl. Raya No. 123, Kota, Provinsi" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 8px; resize: vertical;"></textarea>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Jasa Pengiriman (Ongkir)</label>
                        <select id="shipping-select" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg);">
                            <option value="10000">J&T Express (Reguler) - Rp 10.000</option>
                            <option value="15000">JNE Yes (Kilat) - Rp 15.000</option>
                            <option value="20000">SiCepat BEST - Rp 20.000</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Metode Pembayaran</label>
                        <select id="payment-select" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--card-bg);">
                            <option value="Transfer Bank (BCA)">Transfer Bank (BCA)</option>
                            <option value="Transfer Bank (Mandiri)">Transfer Bank (Mandiri)</option>
                            <option value="E-Wallet (Gopay/OVO/Dana)">E-Wallet (Gopay/OVO/Dana)</option>
                            <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
                        </select>
                    </div>

                    <button type="submit" class="checkout-btn" style="width: 100%; padding: 0.8rem; background-color: var(--accent-green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                        Konfirmasi & Bayar Sekarang
                    </button>
                </form>
            </div>

            <!-- RINGKASAN PESANAN -->
            <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow);">
                <h3 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-dark);">Ringkasan Pesanan</h3>
                
                <!-- TEMPAT ITEM DITERBITKAN DARI JS -->
                <div id="checkout-items-container"></div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 0.8rem; margin-top: 0.8rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.4rem;">
                        <span>Subtotal Produk:</span>
                        <span id="checkout-subtotal">Rp 0</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.4rem;">
                        <span>Ongkir Pengiriman:</span>
                        <span id="checkout-shipping-cost">Rp 10.000</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1rem; font-weight: bold; color: var(--primary-color); margin-top: 0.6rem;">
                        <span>Total Pembayaran:</span>
                        <span id="checkout-total-payment">Rp 0</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL POP-UP NOTA / INVOICE -->
    <div class="modal-overlay" id="invoice-modal">
        <div class="product-detail-card" style="max-width: 450px;">
            <div id="invoice-content"></div>
            <div style="display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem;">
                <button id="confirm-wa-btn" style="background: #25d366; color: white; border: none; padding: 0.7rem; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    💬 Konfirmasi via WhatsApp
                </button>
                <button id="back-to-home-btn" style="background: var(--text-muted); color: white; border: none; padding: 0.7rem; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    Kembali ke Halaman Utama
                </button>
            </div>
        </div>
    </div>

    <script src="checkout.js?v=8888"></script>
</body>
</html>
