<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XemaShop</title>
    <link rel="stylesheet" href="halaman utama.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2>XemaShop</h2>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Cari produk">
        </div>

        <div class="cart-icon" id="cart-btn">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Katalog Produk</h1>
        <div class="category-filters" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <button class="filter-btn active" data-category="all">Semua</button>
            <button class="filter-btn" data-category="PAKAIAN">Pakaian</button>
            <button class="filter-btn" data-category="SEPATU">Sepatu</button>
            <button class="filter-btn" data-category="AKSESORIS">Aksesoris</button>
        </div>
        
        <div class="product-grid" id="product-container">
        </div>
    </main>

    <div class="cart-overlay" id="cart-overlay"></div>

    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Keranjang Belanja</h3>
            <button class="close-btn" id="close-cart-btn">&times;</button>
        </div>
        
        <div class="cart-items" id="cart-items-container">
            <p class="empty-cart-msg">Keranjang kamu masih kosong.</p>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <strong id="cart-total-price">Rp 0</strong>
            </div>
            <button class="checkout-btn" id="checkout-btn">checkout sekarang</button>
        </div>
    </aside>

    <script src="produk.js"></script>
    <script src="app.js"></script>
</body>
</html>
